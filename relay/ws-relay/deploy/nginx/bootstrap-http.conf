# Step 1 of 2: plain HTTP blocks so certbot can prove we own both names.
# Replaced by the final files once the certificates exist.
server {
    listen 80;
    listen [::]:80;
    server_name relay.ownspace.in joinowntally.ownspace.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
