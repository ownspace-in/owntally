# Final config for the WebSocket relay. Needs the certificate from certbot (see RUNBOOK.md).
# The relay program listens on 127.0.0.1:8080 and is started with -trust-proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.ownspace.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.ownspace.in;

    ssl_certificate     /etc/letsencrypt/live/relay.ownspace.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.ownspace.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Never log request lines: the room and key are in the query string.
    access_log off;
    error_log /var/log/nginx/relay-error.log warn;

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # Overwrite, never append: the relay uses this address for rate limits, and a client must not be able to fake it.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
