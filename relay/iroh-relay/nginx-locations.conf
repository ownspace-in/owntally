# Add these location blocks inside the existing "server { listen 443 ssl; server_name relay.ownspace.in; ... }"
# in /etc/nginx/conf.d/relay.ownspace.in.conf, next to "location = /ws". Keep the existing /ws and /healthz blocks:
# /healthz stays with the WebSocket relay.
#
# The paths are the ones iroh-relay serves according to its documentation and my reading; confirm them with
# the loopback curl checks in RUNBOOK.md step 5 before relying on them.

    location = /relay {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name relay.ownspace.in;
        # The backend is on loopback with a certificate for the public name, so it cannot be verified by name here.
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /ping {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name relay.ownspace.in;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location = /generate_204 {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name relay.ownspace.in;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }
