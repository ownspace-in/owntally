# Per-IP limits for the Iroh relay paths. Goes at the top level of /etc/nginx/conf.d/relay.ownspace.in.conf
# (outside any "server" block), because limit_*_zone is only allowed in the "http" context.
#
# These limits work with or without the relay's token: a script that copied the token still has to come
# from an IP, and an IP is capped here. One shared IP (carrier NAT, an office) can hold a few dozen phones,
# so the numbers below are generous on purpose. Tune them from the nginx logs, not from guesses.

# Concurrent connections per IP (each phone holds one long-lived WebSocket to /relay).
limit_conn_zone $binary_remote_addr zone=iroh_conn:10m;
# New requests per IP per second, shared by /relay, /ping and /generate_204.
limit_req_zone $binary_remote_addr zone=iroh_req:10m rate=5r/s;
