# Dependabot (CRYPTO.md, clarification C9). Nothing is merged automatically: the owner decides.
#
# ONE pull request per week for everything (owner request, 5 Nov 2026): all ecosystems share one group, so a week's updates arrive
# together in a single PR instead of a dozen. The three big jumps that broke `main` on 5 Nov 2026 (the Android plugin, Gradle itself,
# the Kotlin plugins) are major versions that must move together and need a deliberate migration, so major version updates are not
# proposed here. A major upgrade is done on purpose, as its own task.
#
# 7 Nov 2026: PR #23 (Kotlin 2.2 to 2.4, KSP, AGP 8.9 to 8.13 and libraries built with Kotlin 2.4) was merged and broke `main`: AGP 8.12 and
# newer cannot run on the Gradle 9.8 wrapper, and the new Kotlin needs the new AGP. It was reverted. Until the planned migration to
# AGP 9, minor and major updates of the Kotlin and Android toolchain and of the libraries that need the new Kotlin are not proposed
# (patch updates are). Remove these entries when that migration is done.
#
# OkHttp stays on 4.12 (decision W1, 8 Nov 2026): 5.x needs compile SDK 37 and so the AGP 9 migration. The rule above (no major updates) already
# keeps 5.x from being proposed.
#
# Tink's version lives in gradle/libs.versions.toml, which Dependabot reads.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: gradle
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor"]
      # Dependabot names the plugins declared as kotlin("jvm") and kotlin("android") just "jvm" and "android" (PR #27 showed it).
      - dependency-name: "jvm"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "android"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: "/relay/ws-relay"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
