# Dependabot (CRYPTO.md, clarification C9). Nothing is merged automatically: the owner decides.
#
# ONE pull request per week for everything (owner request, 5 Nov 2026): all ecosystems share one group, so a week's updates arrive
# together in a single PR instead of a dozen. The three big jumps that broke `main` on 5 Nov 2026 (the Android plugin, Gradle itself,
# the Kotlin plugins) are major versions that must move together and need a deliberate migration, so major version updates are not
# proposed here. A major upgrade is done on purpose, as its own task.
#
# Tink's version lives in gradle/libs.versions.toml, which Dependabot reads.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: gradle
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: "/relay/ws-relay"
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
