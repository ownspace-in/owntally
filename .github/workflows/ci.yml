name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core model
        run: ./gradlew :app:core-model:test --console=plain
