name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test core model
        run: ./gradlew :app:core-model:test :app:crypto:test :app:sync:test --console=plain

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and lint the Android app
        run: >
          ./gradlew :app:app:assembleDebug
          :app:app:testDebugUnitTest :app:ui:testDebugUnitTest :app:data:testDebugUnitTest
          :app:app:lintDebug :app:ui:lintDebug :app:data:lintDebug --console=plain

  ws-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay/ws-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/ws-relay/go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Test the assetlinks tools
        run: python3 -m unittest -v test_assetlinks
