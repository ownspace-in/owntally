# Final config for the invite page. Static files only, nothing runs on the server.
# Files live in /var/www/joinowntally (copy the contents of site/ there).

server {
    listen 80;
    listen [::]:80;
    server_name joinowntally.ownspace.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joinowntally.ownspace.in;

    ssl_certificate     /etc/letsencrypt/live/joinowntally.ownspace.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joinowntally.ownspace.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/joinowntally;
    index index.html;

    # Set here so the site works even if the main nginx.conf does not include mime.types.
    # (nosniff means a wrong type would make browsers refuse the CSS and script.)
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/json          json;
    }

    # No access log: invite links should leave no trace here. (The part after # never reaches the server anyway.)
    access_log off;
    error_log /var/log/nginx/joinowntally-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Android reads this file to let the app open invite links directly. It must be served as JSON, with no redirect.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /j {
        try_files /j/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
